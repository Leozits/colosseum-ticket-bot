name: Check Colosseum ticket availability

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run availability check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m colosseum_monitor.run
        # check_once() already logs failures to log.txt and escalates to Discord
        # after CONSECUTIVE_FAILURES_ALERT_THRESHOLD; a non-zero exit here is
        # informational, not a CI failure -- don't let it skip the commit step
        # below or trigger GitHub's own "workflow failed" email every run.
        continue-on-error: true

      - name: Commit updated state and log
        run: |
          git config user.name "colosseum-ticket-bot"
          git config user.email "actions@users.noreply.github.com"
          [ -f state.json ] && git add state.json
          [ -f log.txt ] && git add log.txt
          git diff --quiet --cached || git commit -m "Update availability state [skip ci]"
          git push
